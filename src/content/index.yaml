# Copy for the home route (routes/index.html).
#
# Each top-level key is a content block, placed by a `<!-- content:<key> -->`
# comment in the route. Under it, one key per language in LANGUAGES
# (src/lib/i18n.ts) and one list item per paragraph.
#
# `>-` folds a paragraph onto one logical line: fold only at spaces that belong
# in the sentence, since each fold becomes a single space.
#
# `{name}` placeholders are filled from `links` below, so prose stays plain text.

lede:
  en:
    - Hi, I'm Junyeong Heo, a programming enthusiast from South Korea 🇰🇷
    - >-
      I enjoy playing with, building, and improving well-designed products that
      have a solid philosophy and craftsmanship.
    - >-
      I'm passionate about spotting challenges and areas for improvement in team
      games, so that we can all succeed together.
    - If you'd like to know more about me, check out my {resume}!
  ko:
    - 안녕하세요, 허준영입니다 🇰🇷
    - >-
      잘 설계된 도구를 탐구하고, 도구가 사용자에게 더 잘 전달될 수 있도록
      개선하는 방법을 고민합니다.
    - >-
      그런 제품을 만들기 위한 팀의 가치를 이해하고, 개선할 수 있는 부분을 찾아
      함께 발전시켜 나갑니다.
    - 저에 대해 더 알고 싶으시다면 {resume}를 확인해주세요!

links:
  resume:
    en: { label: resume, href: /resume/en.pdf }
    ko: { label: 이력서, href: /resume/kr.pdf }
